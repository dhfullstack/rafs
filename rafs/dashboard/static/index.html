<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="description" content="rafs dashboard — simulated values, no real money.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="rafs">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-180.png">
<link rel="stylesheet" href="/static/app.css">
<title>rafs</title>
</head>
<body>
<canvas id="art" class="art" aria-hidden="true"></canvas>
<a class="skip" href="#main">Skip to content</a>

<div id="login" class="login" hidden>
  <div class="login-wrap">
    <svg class="logo lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="23" rx="6.5"/><circle cx="6" cy="6" r="0.9"/><circle cx="12" cy="6" r="1.3"/><circle cx="18" cy="6" r="1.7"/><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.9"/><circle cx="18" cy="12" r="2.4"/><circle cx="6" cy="18" r="1.7"/><circle cx="12" cy="18" r="2.4"/><circle cx="18" cy="18" r="2.9"/></svg>
    <h1 id="greet">Good evening.</h1>
    <p id="clock" class="clock mono"></p>
    <form id="login-form" class="term">
      <div class="term-bar" aria-hidden="true"><i></i><i></i><i></i><span class="mono">rafs@desk:~</span></div>
      <div class="term-body">
        <label for="pw" class="prompt mono"><span aria-hidden="true">›</span><span class="sr">Dashboard password</span></label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <button type="submit" class="send" aria-label="Sign in">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </form>
    <p id="login-error" class="form-error" role="alert"></p>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-left">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="23" rx="6.5"/><circle cx="6" cy="6" r="0.9"/><circle cx="12" cy="6" r="1.3"/><circle cx="18" cy="6" r="1.7"/><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.9"/><circle cx="18" cy="12" r="2.4"/><circle cx="6" cy="18" r="1.7"/><circle cx="12" cy="18" r="2.4"/><circle cx="18" cy="18" r="2.9"/></svg>
      <span class="brand mono">rafs<span class="host">@desk</span></span>
      <span class="slash" aria-hidden="true">/</span>
      <label class="env">
        <span class="sr">Environment</span>
        <select id="env"></select>
      </label>
    </div>
    <div class="top-right">
      <span class="sim" title="Simulated values — not real profit">Simulated</span>
      <span id="status-pill" class="status"><i class="dot"></i><span>connecting</span></span>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-tab="overview" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      <span>Overview</span></button>
    <button data-tab="live">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6H21"/></svg>
      <span>Live</span></button>
    <button data-tab="memes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/><path d="M8.5 12.5l2-2 1.5 1.5 2-2.5"/></svg>
      <span>Memes</span></button>
    <button data-tab="agents">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M12 7v4m0 0l-5.5 5.3M12 11l5.5 5.3"/></svg>
      <span>Agents</span></button>
    <button data-tab="perf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M16 6h4v4"/></svg>
      <span>Performance</span></button>
    <button data-tab="controls">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10m4 0h2M4 17h2m4 0h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>Controls</span></button>
  </nav>
  <div class="notice" id="disclaimer" role="note"></div>
  <main id="main" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<dialog id="confirm" class="dialog">
  <form method="dialog" id="confirm-form">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text" class="muted"></p>
    <div id="confirm-word-wrap" hidden>
      <label for="confirm-word">Type <strong id="confirm-word-label" class="mono"></strong> to confirm</label>
      <input id="confirm-word" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>
    <div class="dialog-actions">
      <button value="cancel" class="btn" formnovalidate>Cancel</button>
      <button value="ok" id="confirm-ok" class="btn primary">Confirm</button>
    </div>
  </form>
</dialog>
<script src="/static/app.js"></script>
</body>
</html>
